<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #202a36;
    }
    body { margin: 0; padding: 8px 2px; background: transparent; }
    button {
      min-height: 42px; border: 1px solid #014baa; border-radius: 8px; padding: 9px 14px;
      background: #014baa; color: #fff; font: inherit; font-weight: 650;
      cursor: pointer; transition: background-color 120ms ease, border-color 120ms ease;
    }
    button:hover:not(:disabled) { border-color: #013d8c; background: #013d8c; }
    button:focus-visible { outline: 3px solid #014baa80; outline-offset: 2px; }
    button:disabled { cursor: not-allowed; opacity: .58; }
    #location-status { margin: 8px 0 0; color: #202a36; overflow-wrap: anywhere; }
    #location-detail { margin: 4px 0 0; color: #526171; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <button id="request-location" type="button">Use My Current Location</button>
    <p id="location-status" role="status" aria-live="polite"></p>
    <p id="location-detail"></p>
  </main>
  <script>
    (() => {
      const button = document.getElementById("request-location");
      const status = document.getElementById("location-status");
      const detail = document.getElementById("location-detail");
      const supported = Boolean(navigator.geolocation);
      button.disabled = !supported;
      status.textContent = supported
        ? "Location is not requested until you press this button. Browser permission is required."
        : "This browser does not support the Geolocation API. Enter a starting place manually.";

      function postToStreamlit(type, data) {
        window.parent.postMessage(
          Object.assign({isStreamlitMessage: true, type: type}, data),
          "*"
        );
      }

      function setFrameHeight() {
        postToStreamlit("streamlit:setFrameHeight", {height: document.body.scrollHeight + 8});
      }

      function sendResult(result) {
        result.request_id = Date.now().toString() + "-" + Math.random().toString(36).slice(2);
        postToStreamlit("streamlit:setComponentValue", {value: result, dataType: "json"});
      }

      window.addEventListener("message", (event) => {
        if (event.data && event.data.type === "streamlit:render") {
          setFrameHeight();
        }
      });
      postToStreamlit("streamlit:componentReady", {apiVersion: 1});
      setFrameHeight();

      button.addEventListener("click", () => {
        if (!navigator.geolocation) {
          status.textContent = "This browser does not support the Geolocation API. Enter a starting place manually.";
          sendResult({status: "unsupported"});
          return;
        }
        button.disabled = true;
        detail.textContent = "";
        status.textContent = "Requesting your location. Respond to the browser permission prompt if shown.";
        navigator.geolocation.getCurrentPosition((position) => {
          const location = {
            status: "success",
            latitude: position.coords.latitude,
            longitude: position.coords.longitude,
            accuracy: position.coords.accuracy,
            timestamp: position.timestamp
          };
          status.textContent = "Location detected.";
          detail.textContent = "Latitude " + location.latitude.toFixed(6)
            + ", longitude " + location.longitude.toFixed(6)
            + " (accuracy ±" + Math.round(location.accuracy) + " m).";
          button.disabled = false;
          setFrameHeight();
          sendResult(location);
        }, (error) => {
          const messages = {
            1: ["permission_denied", "Location permission was denied. Allow it in browser settings or use the manual starting point."],
            2: ["position_unavailable", "The device could not determine a location. Check location services or use the manual starting point."],
            3: ["timeout", "The location request timed out. Try again or use the manual starting point."]
          };
          const result = messages[error.code] || ["error", "Location could not be determined. Use the manual starting point."];
          status.textContent = result[1];
          button.disabled = false;
          setFrameHeight();
          sendResult({status: result[0], message: result[1]});
        }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
      });
    })();
  </script>
</body>
</html>
